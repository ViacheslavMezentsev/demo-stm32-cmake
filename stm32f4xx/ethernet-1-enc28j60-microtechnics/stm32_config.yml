# ==============================================================================
#      Универсальный конфигурационный файл для проекта на STM32
# Репозиторий фреймворка: https://github.com/ViacheslavMezentsev/stm32-cmake-yml
# ==============================================================================
# Примечание: 'auto' означает, что значение будет определено автоматически.
# Параметры, отмеченные как (Опционально), можно удалить, если вас
# устраивает поведение по умолчанию.
# ==============================================================================
# Укажите версию фреймворка stm32-cmake-yml, с которой совместим
# этот конфигурационный файл.
stm32_cmake_yml_version: "0.4"

# (Опционально) Включает проверку совместимости версий.
# true (по умолчанию): система сборки будет сравнивать версию фреймворка
#       и версию, указанную выше, выдавая предупреждения при несоответствии.
# false: проверка будет полностью отключена.
stm32_cmake_yml_version_check: false


# ==============================================================================
# 1. ОСНОВНЫЕ ПАРАМЕТРЫ ПРОЕКТА
# ------------------------------------------------------------------------------
# Эти параметры определяют самую суть вашего проекта.
# ==============================================================================

# (Опционально) Если указан, настройки MCU, heap/stack и CubeFW будут взяты
# из этого файла. Идеально для проектов из STM32CubeMX.
ioc_file: "ethernet-1-enc28j60-microtechnics.ioc"

# (Опционально) Имя проекта. Если "auto" или параметр опущен, используется имя папки.
#project_name: "auto"

# Точное наименование MCU. Обязательно, если не используется ioc_file.
mcu: "STM32F407VGT"

# (Опционально) Ядро для многоядерных MCU.
# Укажите 'M7' или 'M4' для STM32H7, или 'M4' для STM32WB и т.д.
# Опускайте (закомментируйте) параметр для обычных MCU.
#mcu_core: "M7"

# (Опционально) Размеры кучи и стека (только для linker_script: "auto").
# Поддерживаются форматы "1024" (байты), "2K".
heap_size: "512"
stack_size: "1K"


# ==============================================================================
# 2. ИСХОДНЫЕ ФАЙЛЫ И СТРУКТУРА
# ------------------------------------------------------------------------------
# Здесь описывается, из чего состоит ваш проект.
# ==============================================================================

# Список папок-модулей и отдельных исходных файлов.
# Папки должны содержать свой CMakeLists.txt.
sources:
  - "Core"    # Можно добавить целую папку (через add_subdirectory)
  - "Modules"
  - "Core/Src/system_stm32f4xx.c"   # Пример переопределения system-файла
  - "startup_stm32f407xx.s"         # Пример переопределения startup-файла

# (Опционально) Дополнительные пути к папкам с заголовочными файлами.
include_directories:
#  - "."       # положение stm32f4xx_hal_conf.h


# ==============================================================================
# 3. НАСТРОЙКИ ДРАЙВЕРОВ И БИБЛИОТЕК ST
# ------------------------------------------------------------------------------
# Управление подключением библиотек CMSIS, HAL и LL.
# ==============================================================================

# (Опционально) Включает поддержку CMSIS через stm32-cmake.
# true (по умолчанию): система ищет и подключает CMSIS (ядро, заголовки, startup).
# false: CMSIS не подключается. Вы должны предоставить все системные файлы сами.
#use_cmsis: true

# (Опционально) Включает поддержку HAL/LL через stm32-cmake.
# true (по умолчанию): система ищет и подключает компоненты HAL/LL из списка ниже.
# false: список hal_components игнорируется.
#use_hal: true

# (Опционально) Версия пакета драйверов.
# "auto" (по умолчанию): приоритет у локальной папки 'Drivers', затем поиск
# последней версии в репозитории.
# "V1.28.2": явное указание версии из глобального репозитория.
#cubefw_package: "auto"

# Список компонентов HAL/LL для подключения.
# USE_HAL_DRIVER добавляется, если список не пуст.
# USE_FULL_LL_DRIVER добавляется, если есть элемент с префиксом "LL_".
hal_components:
  - "RCC"
  - "GPIO"
  - "SPI"
  - "CORTEX"


# ==============================================================================
# 4. НАСТРОЙКИ RTOS
# ------------------------------------------------------------------------------
# Управление подключением операционной системы реального времени FreeRTOS.
# ==============================================================================

# (Опционально) Включает поддержку FreeRTOS через stm32-cmake.
# true: система будет искать и подключать компоненты FreeRTOS из списка ниже.
# false (по умолчанию): поддержка FreeRTOS отключена.
#use_freertos: true

# (Опционально) Версия FreeRTOS.
# "cube": (по умолчанию) Используются исходники FreeRTOS, идущие в комплекте
#         с пакетом STM32Cube FW. Это самый надежный вариант.
# "external": (продвинутый) Используется внешняя версия FreeRTOS. Требует
#             установки переменной FREERTOS_PATH.
#freertos_version: "cube"

# Компоненты FreeRTOS для подключения.
#freertos_components:
  # --- Основные компоненты ---
#  - "ARM_CM4F"  # [ОБЯЗАТЕЛЬНО] Укажите порт для вашего ядра (ARM_CM0, ARM_CM3, ARM_CM4F, ARM_CM7 и т.д.)
#  - "Heap::2"   # [ОБЯЗАТЕЛЬНО] Укажите номер схемы управления памятью (Heap::1 ... Heap::5)
  
  # --- Опциональные компоненты ---
#  - "Timers"        # Программные таймеры
#  - "EventGroups"   # Группы событий
#  - "Coroutine"     # Корутины (устаревший механизм)
#  - "StreamBuffer"  # Потоковые буферы

# (Опционально) Использовать ли обертку CMSIS-RTOS.
# "v1": использовать CMSIS-RTOS API v1.
# "v2": использовать CMSIS-RTOS API v2.
# "none" (по умолчанию): не использовать, работать с нативным API FreeRTOS.
#cmsis_rtos_api: "v2"


# ==============================================================================
# 5. НАСТРОЙКИ КОМПИЛЯЦИИ И КОМПОНОВКИ
# ------------------------------------------------------------------------------
# Тонкая настройка процесса сборки.
# ==============================================================================

# --- Языки и стандарты ---
# (Опционально) Если секция отсутствует, по умолчанию будут использованы C, CXX, ASM.
languages: [C, CXX, ASM]
c_standard: 17
cpp_standard: 17

# --- Компиляция ---
# (Опционально) Дополнительные определения препроцессора.
#compile_definitions:

# (Опционально) Дополнительные флаги компилятора.
compile_options:
  - "-Os"
#  - "-gdwarf-2"         # для симуляции в Proteus
#  - "-gstrict-dwarf"    # для симуляции в Proteus
  - "-g3"

# --- Компоновка ---
# (Опционально) Список путей к прекомпилированным статическим библиотекам (.a).
#custom_libraries:

# (Опционально) Дополнительные библиотеки для компоновки (например, 'm' для libm).
#link_libraries:

# (Опционально) Опции, передаваемые компилятору на этапе компоновки.
#link_options:

# (Опционально) Прямые директивы для компоновщика (например, "--gc-sections").
linker_directives:
  - "--print-memory-usage"
#  - "--no-warn-rwx-segments"

# (Опционально) Скрипт компоновщика.
# "auto" (по умолчанию): генерация из шаблона. В этом режиме работают heap/stack.
# "path/to/script.ld": использование пользовательского скрипта.
#linker_script: "auto"


# ==============================================================================
# 6. СИСТЕМНЫЕ НАСТРОЙКИ И АРТЕФАКТЫ
# ------------------------------------------------------------------------------
# Выбор системных библиотек и выходных файлов.
# ==============================================================================

# (Опционально) Использовать newlib-nano для уменьшения размера кода.
# true: используется сборка newlib, оптимизированная для минимального размера кода.
# false (по умолчанию): используется "полная" версия newlib.
# Используйте newlib-nano (рекомендуется для большинства проектов):
# - Если у вас микроконтроллер с ограниченным объемом Flash (меньше 256 КБ).
# - Если вам не требуется выводить числа с плавающей точкой через printf
#   (или вы готовы включить эту опцию отдельно).
# - Если для вас размер прошивки важнее, чем максимальная производительность
#   математических функций.
# Не используйте newlib-nano (используйте обычную newlib):
# - Если у вас микроконтроллер с большим объемом памяти (512 КБ и больше),
#   и экономия 10-20 КБ для вас не критична.
# - Если ваш проект интенсивно использует printf с числами с плавающей точкой и другие
#   сложные функции libc, и вы хотите получить максимальную производительность "из коробки".
use_newlib_nano: true

# Выбор реализации системных вызовов: "NoSys" или "Semihosting".
# "NoSys": системные вызовы (syscalls) реализованы через libnosys
# "Semihosting": системные вызовы (syscalls) реализованы через librdimon
# При отсутствии параметра вы должны подключить свою реализацию syscalls.
system_library: "NoSys"

# Список желаемых артефактов сборки.
build_artifacts: [ "bin", "hex", "map", "lss" ]


# ==============================================================================
# 7. НАСТРОЙКИ ОТЛАДКИ СБОРКИ
# ------------------------------------------------------------------------------
# Эти параметры не влияют на саму прошивку, но помогают диагностировать
# проблемы в процессе конфигурации и сборки проекта.
# ==============================================================================

# Ваш отладочный процесс:
# При изменении project_config.yml (или при ручной переконфигурации):
# - Установите log_target_properties: true.
# - Запустите конфигурацию CMake.
# В окне "Output" вы увидите детальный отчет о том, какие свойства CMake "привязал" к вашей цели.
# Это поможет понять, правильно ли "протекли" зависимости от stm32-cmake и ваших модулей.
# При сборке проекта:
# - Установите verbose_build: true.
# - Запустите сборку.
# В терминале вы увидите реальные команды, которые передаются компилятору и компоновщику.
# Это финальная, неоспоримая правда. Сравнивая вывод этих двух этапов, вы сможете 
# диагностировать практически любую проблему, связанную с флагами, путями или зависимостями.

# (Опционально) Включает проверку корректности скрипта компоновщика.
# true (по умолчанию): система сборки сравнит размер RAM, указанный в вашем
#       .ld файле (или шаблоне), с эталонным размером для выбранного MCU.
#       Если размер в скрипте будет больше физически существующего,
#       конфигурация остановится с ошибкой, предотвращая Hard Fault при запуске.
# false: проверка не выполняется.
validate_linker_script: true

# (Опционально) Включает вывод свойств цели в лог конфигурации.
# true: в логе конфигурации CMake будет распечатан список опций, определений
#       и путей, которые CMake "привязал" к финальному исполняемому файлу
#       и унаследовал от stm32-cmake.
# false (по умолчанию): не выводить.
log_target_properties: false

# (Опционально) Включает подробный вывод команд во время сборки.
# true: вы увидите полную команду компиляции для каждого файла.
# false (по умолчанию): краткий вывод.
verbose_build: false
