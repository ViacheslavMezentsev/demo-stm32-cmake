# Универсальный конфигурационный файл для проекта на STM32.
# Используется внешний инструмент 'yq' для преобразования YAML в JSON,
# а затем встроенные возможности CMake для разбора JSON.

#-------------------------------------------------------------------------------
# Если указан путь к .ioc файлу, большинство настроек
# (MCU, версия CubeFW, heap/stack) будут взяты из него.
# В этом режиме остальные параметры в этом файле игнорируются или дополняют .ioc.
ioc_file: "ethernet-1-enc28j60-microtechnics.ioc"
# Оставьте пустым или удалите, чтобы использовать ручную настройку ниже.
#ioc_file: "" 
#-------------------------------------------------------------------------------

# Описание: Имя проекта. Если 'auto', используется имя папки.
#project_name: "auto"

# Языки программирования, используемые в проекте.
# CMake активирует поддержку для перечисленных языков.
# Если секция отсутствует, по умолчанию будут использованы C, CXX, ASM.
languages:
  - C
  - CXX
  - ASM

c_standard: 17
cpp_standard: 17

# Настройки микроконтроллера.
# Описание: Точное название MCU от ST (семейство, серия, линейка, конфигурация).
mcu: "STM32F407VGT"

# Настройки системы сборки.

# Компоненты HAL и LL.
# Использовать ли автоматическое подключение компонентов HAL/LL.
# true: (по умолчанию) stm32-cmake найдет и подключит компоненты из списка hal_components.
# false: список hal_components будет проигнорирован. Все исходники HAL/LL
#        должны быть добавлены вручную через секцию 'sources'.
#use_hal_components: true

# Версия STM32Cube Firmware Package.
# Укажите "auto" для автоматического нахождения пакета драйверов
# для вашего семейства MCU, или укажите конкретную версию (например, "V1.28.2").
#cubefw_package: "auto"

# Настройки памяти (с суффиксами K/M для удобства).
# Описание: Размеры кучи и стека. Поддерживаются суффиксы K (килобайт) и M (мегабайт).
# Можно указывать как "1024", "1K", "2K".
#heap_size: "512"
#stack_size: "1K"

# Исходные файлы и библиотеки.

# Каждый элемент - это путь к папке или файлу относительно этого конфига.
sources:
  - "Core"    # Можно добавить целую папку (через add_subdirectory)
  - "Modules"
  - "Core/Src/system_stm32f4xx.c"   # Пример переопределения system-файла
  - "startup_stm32f407xx.s"         # Пример переопределения startup-файла

# Заголовочные файлы (пути к папкам).
include_directories:
#  - "./Core/Inc"       # положение stm32f4xx_hal_conf.h

# Компоненты HAL и LL.
# USE_HAL_DRIVER добавляется, если список не пуст.
# USE_FULL_LL_DRIVER добавляется, если есть элемент с префиксом "LL_".
hal_components:
  - "RCC"
#  - "DMA"
  - "GPIO"
  - "SPI"
#  - "UART"
#  - "USART"
  - "CORTEX"

# Вспомогательные системные библиотеки.
# Использование newlib-nano для уменьшения размера кода.
use_newlib_nano: true

# Выберите ОДНУ из: NoSys или Semihosting
system_library: "NoSys"

# Настройки компиляции.

# Дополнительные опции компилятора.
compile_options:
#  - "-Wextra"
#  - "-Wpedantic"

# Определения для препроцессора.
# USE_HAL_DRIVER и USE_FULL_LL_DRIVER добавляются автоматически.
compile_definitions:

# Настройки компоновки.

# Скрипт компоновщика: "auto" для генерации или путь к файлу.
#linker_script: "auto"
#linker_script: "linker/my_custom_script.ld"

# Опции, передаваемые компилятору на этапе компоновки.
link_options:
#  - "-lm" # Пример: подключить математическую библиотеку

# Прямые директивы для компоновщика (будут с префиксом LINKER:).
linker_directives:
  - "--print-memory-usage"
#  - "--gc-sections"

# Список дополнительных библиотек для компоновки.
link_libraries:
#  - "m" # Математическая библиотека, альтернатива -lm
#  - "c"

# Артефакты сборки (список желаемых дополнительных файлов).
build_artifacts:
  - "bin"
  - "hex"
  - "map"
  - "lss"
