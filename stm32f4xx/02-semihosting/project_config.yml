# ==============================================================================
#
#      Универсальный конфигурационный файл для проекта на STM32
#      Версия шаблона: 0.1
#
# ==============================================================================
# Примечание: 'auto' означает, что значение будет определено автоматически.
# Параметры, отмеченные как (Опционально), можно удалить, если вас
# устраивает поведение по умолчанию.
# ==============================================================================


# ==============================================================================
# 1. ОСНОВНЫЕ ПАРАМЕТРЫ ПРОЕКТА
# ------------------------------------------------------------------------------
# Эти параметры определяют самую суть вашего проекта.
# ==============================================================================

# (Опционально) Если указан, настройки MCU, heap/stack и CubeFW будут взяты
# из этого файла. Идеально для проектов из STM32CubeMX.
ioc_file: ""

# (Опционально) Имя проекта. Если "auto" или параметр опущен, используется имя папки.
project_name: "auto"

# Точное наименование MCU. Обязательно, если не используется ioc_file.
mcu: "STM32F407VGT"

# (Опционально) Размеры кучи и стека (только для linker_script: "auto").
# Поддерживаются форматы "1024" (байты), "2K", "0.5M".
heap_size: "512"
stack_size: "1K"


# ==============================================================================
# 2. ИСХОДНЫЕ ФАЙЛЫ И СТРУКТУРА
# ------------------------------------------------------------------------------
# Здесь описывается, из чего состоит ваш проект.
# ==============================================================================

# Список папок-модулей и отдельных исходных файлов.
# Папки должны содержать свой CMakeLists.txt.
sources:
#  - "Core"   # Можно добавить целую папку (через add_subdirectory)
#  - "User"
#  - "system_stm32f1xx.c"
#  - "startup_stm32f103xb.s"
  - "main.cpp"

# (Опционально) Дополнительные пути к папкам с заголовочными файлами.
include_directories:
  - "."       # положение stm32f1xx_hal_conf.h


# ==============================================================================
# 3. НАСТРОЙКИ ДРАЙВЕРОВ STM32CUBE
# ------------------------------------------------------------------------------
# Управление подключением библиотек HAL и LL.
# ==============================================================================

# (Опционально) Автоматическое подключение компонентов HAL/LL.
# true (по умолчанию): система ищет и подключает компоненты из списка ниже.
# false: список hal_components игнорируется.
use_hal_components: true

# (Опционально) Версия пакета драйверов.
# "auto" (по умолчанию): приоритет у локальной папки 'Drivers', затем поиск
# последней версии в репозитории.
# "V1.28.2": явное указание версии из глобального репозитория.
cubefw_package: "auto"

# Список компонентов HAL/LL для подключения.
# USE_HAL_DRIVER добавляется, если список не пуст.
# USE_FULL_LL_DRIVER добавляется, если есть элемент с префиксом "LL_".
hal_components:
#  - "RCC"
#  - "DMA"
#  - "GPIO"
#  - "UART"
#  - "USART"
  - "CORTEX"


# ==============================================================================
# 4. НАСТРОЙКИ КОМПИЛЯЦИИ И КОМПОНОВКИ
# ------------------------------------------------------------------------------
# Тонкая настройка процесса сборки.
# ==============================================================================

# --- Языки и стандарты ---
# (Опционально) Если секция отсутствует, по умолчанию будут использованы C, CXX, ASM.
languages: [C, CXX, ASM]
c_standard: 17
cpp_standard: 17

# --- Компиляция ---
# (Опционально) Дополнительные флаги компилятора.
compile_options: []

# (Опционально) Дополнительные определения препроцессора.
compile_definitions: []

# --- Компоновка ---
# (Опционально) Скрипт компоновщика.
# "auto" (по умолчанию): генерация из шаблона. В этом режиме работают heap/stack.
# "path/to/script.ld": использование пользовательского скрипта.
linker_script: "auto"

# (Опционально) Дополнительные библиотеки для компоновки (например, 'm' для libm).
link_libraries: []

# (Опционально) Опции, передаваемые компилятору на этапе компоновки.
link_options: []

# (Опционально) Прямые директивы для компоновщика (например, "--gc-sections").
linker_directives:
  - "--print-memory-usage"
  - "--no-warn-rwx-segments"

# ==============================================================================
# 5. СИСТЕМНЫЕ НАСТРОЙКИ И АРТЕФАКТЫ
# ------------------------------------------------------------------------------
# Выбор системных библиотек и выходных файлов.
# ==============================================================================

# (Опционально) Использовать newlib-nano для уменьшения размера кода.
use_newlib_nano: true

# Выбор реализации системных вызовов: "NoSys" или "Semihosting".
system_library: "Semihosting"

# Список желаемых артефактов сборки.
build_artifacts: [ "bin", "hex", "map", "lss" ]
